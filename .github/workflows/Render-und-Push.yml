name: Render & Push

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 16 * * *'    # UTC+8 00:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 迁出代码
        uses: actions/checkout@v4

      # 只改了草稿的话构建产物不会变（Astro 不渲染 draft），
      # 直接跳过后面的安装、渲染、部署和缓存清除。
      - name: 判断是否只有草稿变动
        id: draft
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          # 浅克隆下拿不到基线提交，改用 Compare API 取变更列表
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/draft-only.mjs

      - name: 获取提交版本号
        id: get_version
        run: |
          version=$(git rev-parse --short HEAD)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Latest commit version: $version"

      - name: 安装 Bun
        if: steps.draft.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        if: steps.draft.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      # site.ts 里的 {{GIT_VERSION}} 在构建期由 src/lib/site.ts 读取 GIT_VERSION 环境变量替换，
      # 这里不需要改源文件，环境变量会跟着下一步一起传给 Astro。
      - name: 渲染博客界面
        if: steps.draft.outputs.skip != 'true'
        env:
          GIT_VERSION: ${{ env.VERSION }}
        run: bun run build

      - name: 部署到 Deploy 分支
        if: steps.draft.outputs.skip != 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy
          folder: dist

      - name: 发布到服务器
        if: steps.draft.outputs.skip != 'true'
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          # -c 用内容校验和决定是否传输：构建会重写整个 dist，
          # 所有文件的 mtime 都是新的，不加 -c 每次都会全量上传。
          ARGS: "-rltgoDzvOc --delete"
          EXCLUDE: /.git/, /.github/, /README.md, /LICENSE, /html_files.txt
          SOURCE: "dist"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          TARGET: ${{ secrets.SITE_ADDR }}

      # 页面缓存 s-maxage 一小时，不清除的话新内容最多晚一小时才出现。
      # 三个变量缺任何一个都会跳过，不影响部署本身。
      - name: 清除 Cloudflare 缓存
        if: vars.CLOUDFLARE_ENABLED != 'false' && steps.draft.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_SITE_URL: ${{ secrets.CLOUDFLARE_SITE_URL }}
        run: node scripts/purge-cloudflare.mjs
